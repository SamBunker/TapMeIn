# Simplified docker-compose for Portainer Stack deployment
# Upload this file to Portainer and configure environment variables in the UI

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tapmeinnfc}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - tapmeinnfc

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - tapmeinnfc

  app:
    build:
      context: https://github.com/yourusername/TapMeIn.git#main
      # OR if uploading manually, use:
      # context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:${CONTAINER_PORT:-3000}"
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CONTAINER_PORT:-3000}
      BASE_URL: ${BASE_URL}

      # Database (uses service names for internal networking)
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-tapmeinnfc}?authSource=admin
      REDIS_URL: redis://redis:6379

      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      SESSION_SECRET: ${SESSION_SECRET}

      # Email Service
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME:-TapMeIn NFC}

      # SMS Service
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      # Payment Processing
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # Additional Services
      IPINFO_API_KEY: ${IPINFO_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}

      # Feature Flags
      ENABLE_SMS: ${ENABLE_SMS:-false}
      ENABLE_WEBHOOKS: ${ENABLE_WEBHOOKS:-false}
      ENABLE_AI_EMAIL: ${ENABLE_AI_EMAIL:-false}

      # Admin User
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - tapmeinnfc
      - d-nginx_default

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  uploads_data:

networks:
  tapmeinnfc:
    driver: bridge
  d-nginx_default:
    external: true
