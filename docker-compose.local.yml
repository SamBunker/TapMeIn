# Local Development with Docker Compose
# Usage: docker-compose -f docker-compose.local.yml up

version: '3.8'

services:
  # MongoDB Database (Local)
  mongodb:
    image: mongo:7.0
    container_name: tapmeinnfc-mongo-local
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: tapmeinnfc_dev
    volumes:
      - mongodb_data_local:/data/db
    networks:
      - tapmeinnfc-local

  # Redis (Local)
  redis:
    image: redis:7.2-alpine
    container_name: tapmeinnfc-redis-local
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - tapmeinnfc-local

  # TapMeIn Application (Local Dev with Hot Reload)
  app:
    image: node:18-slim
    container_name: tapmeinnfc-app-local
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      BASE_URL: http://localhost:3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tapmeinnfc_dev?authSource=admin
      REDIS_URL: redis://redis:6379

      # Load from .env file
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

      # Optional services
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      IPINFO_API_KEY: ${IPINFO_API_KEY}
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Use named volume for node_modules (faster on Windows)
      - node_modules_local:/app/node_modules
    command: bash -c "npm install && npm run dev"
    depends_on:
      - mongodb
      - redis
    networks:
      - tapmeinnfc-local

volumes:
  mongodb_data_local:
  redis_data_local:
  node_modules_local:

networks:
  tapmeinnfc-local:
    driver: bridge
